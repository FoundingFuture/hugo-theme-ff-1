name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    # The template carries no theme, so there is nothing to package and
    # nothing to publish. A version tag here names the pipeline, and the
    # gates below read a theme. bootstrap.yml reads the same flag.
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Where Pages will serve this. base_url is the address the deploy
      # action publishes to, so taking the demo's baseURL from anywhere
      # else is two sources of truth that can disagree -- and they did:
      # v0.1.0 was built for .../hugo-theme-ff-1/demo/ and served from
      # .../hugo-theme-ff-1/, so every asset 404'd.
      - uses: actions/configure-pages@v5
        id: pages

      - name: Install Hugo
        run: |
          set -euo pipefail
          version="$(cat .hugo-version)"
          curl -fsSL -o "$RUNNER_TEMP/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${version}/hugo_extended_${version}_linux-amd64.tar.gz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$HOME/.local/bin" hugo
          # build/versions builds the fixture twice, against the pinned
          # Hugo and against the newest one, so a release says whether the
          # theme still works on the Hugo a reader is about to install.
          # Without this it skipped, and a skipped check is a failure here.
          newest="$(curl -fsSL https://api.github.com/repos/gohugoio/hugo/releases/latest \
            | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p' | head -1)"
          if [ -n "$newest" ] && [ "$newest" != "$version" ]; then
            curl -fsSL -o "$RUNNER_TEMP/hugo-latest.tar.gz" \
              "https://github.com/gohugoio/hugo/releases/download/v${newest}/hugo_extended_${newest}_linux-amd64.tar.gz"
            tar -xzf "$RUNNER_TEMP/hugo-latest.tar.gz" -C "$RUNNER_TEMP" hugo
            mv "$RUNNER_TEMP/hugo" "$HOME/.local/bin/hugo-latest"
          else
            cp "$HOME/.local/bin/hugo" "$HOME/.local/bin/hugo-latest"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the tools the gates name
        run: |
          set -euo pipefail
          pip install --quiet html5validator
          npm install --global --silent pa11y-ci @lhci/cli stylelint stylelint-config-standard eslint
          # output/visual needs these three, and the release is the run
          # that writes the baseline every later run compares against.
          npm install --global --silent playwright pixelmatch pngjs
          npx --yes playwright install --with-deps chromium
          # Fetched by the same script a workstation uses, so the pin
          # in tools.sh binds here too.
          tools/scripts/tools.sh shellcheck fetch
          tools/scripts/tools.sh htmltest fetch
          # fontTools goes the same way. static/glyphs reads the faces to
          # check that every mark the theme draws is in one that can draw
          # it, and it looks for fontTools and brotli in the tree's own
          # venv rather than on PATH, so pip installing it globally does
          # not answer. A skipped check is a failure here.
          tools/scripts/tools.sh fonttools fetch


      - name: Every gate, then the release gate
        env:
          CI: "true"
          RELEASE_TAG: ${{ github.ref_name }}
          # Straight from the deploy target. upload-pages-artifact serves
          # the contents of public/demo at that address, so this is the
          # only value that cannot be wrong.
          DEMO_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          ./c check
          ./c check gate=release

      # Written by the same script the gates ran on. Nothing is
      # assembled here, so nothing here can differ from what was tested.
      - name: The artefact
        run: ./c package

      # The changelog section is parsed once, by release.sh, and put in
      # the annotated tag. Reading it back from the tag is what keeps the
      # tag message and the release notes from ever disagreeing. The
      # release gate fails on a missing section, so this cannot be empty.
      - name: The release notes, from the tag
        run: |
          set -euo pipefail
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > .release-body.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .release-body.md
          generate_release_notes: false
          files: 'dist/*.zip'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/conformance/public/demo

      - uses: actions/deploy-pages@v4
