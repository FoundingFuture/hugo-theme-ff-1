baseURL = 'https://example.org/'
title = 'ff-1'
locale = 'en-us'

theme = 'ff-1'

# Two languages, so the band names them and a reader can cross between.
# English stays at the root and French sits under /fr/. A page with no
# French version is simply absent from the French site.
defaultContentLanguage = 'en'

[languages.en]
  label = 'English'
  weight = 1

[languages.fr]
  label = 'Français'
  weight = 2

[params.ff-1]
  # A line across the top. Without one there is no band.
  tagline = 'A dense publishing theme'

  # code-copy is off by default, because a button on every block is a
  # choice rather than a given. The demo switches it on: it shares the
  # noClasses requirement below, and a demo that never shows it leaves
  # the pairing unproven.
  [params.ff-1.features]
    code-copy = true

  # Which markup KaTeX writes is not set here, so the demo takes the
  # default: mathml, which needs no stylesheet and no script, and is
  # what a site gets without saying anything.
  #
  # features/katex-markup asks for htmlAndMathml in its own front
  # matter, so both paths are exercised by the demo itself and each
  # page shows what it says it shows. Before the mode could be set per
  # page, the site had to choose one for every page it had.
  # The line under the mark in the brand cell.
  established = 'a Hugo theme'
  # The colours the top-level topics take, in order.
  palette = ['teal', 'indigo', 'rose', 'amber']
  # A poster is fetched from the service while the site builds. The
  # demo is built by a gate that turns every warning into a failure,
  # and a build with no network out would fail on the fetch rather than
  # on anything the theme did. The embed then renders its link, which
  # is what a reader without the script gets anyway.
  fetchPosters = false

# A Markdown image alone in a paragraph is wrapped in <p> by Goldmark.
# figure-captions renders such an image as a <figure>, and a figure
# inside a paragraph closes it: the browser emits a stray </p> and the
# page stops being valid HTML.
#
# A theme cannot set this. Hugo merges params and other maps from a
# theme but not markup, so the site has to say it. Same wall that stops
# a theme adding an [outputs] format or a menus entry.
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

# The katex feature needs this, and needs it for the same reason.
#
# Goldmark reads a backslash before a bracket as an escape and eats it,
# so \(E = mc^2\) reaches the page as (E = mc^2) and $$...$$ arrives as
# literal text. The theme's render-passthrough hook never fires, because
# a hook for an extension that is off has nothing to render. The build
# succeeds and says nothing: the formula is not missing, it is quietly
# wrong.
#
# The delimiters are the ones the theme's own fixture uses, and the ones
# every LaTeX writer expects.
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)']]

# Chroma writes its colours into the markup as inline styles unless it is
# told to use classes. With styles, the theme's own code colours never
# apply: a code block arrives in Chroma's default palette on a dark
# ground, one of whose colours fails AA contrast, and dark mode cannot
# remap any of it because there is nothing to remap.
[markup.highlight]
  noClasses = false
  style = "xcode"
