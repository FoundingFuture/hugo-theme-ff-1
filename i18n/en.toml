# Every string the templates render. A theme that spells a word inside
# its markup cannot be translated. The words gate reads the keys here
# to decide whether one is used or missing.

[copyright]
other = "Copyright {{ .Year }}. All rights reserved."

[readingTime]
one = "{{ .Count }} minute read"
other = "{{ .Count }} minutes read"

[lastModified]
other = "Revised {{ .Date }}"

[breadcrumbs]
other = "Breadcrumb"

[contents]
other = "Contents"

[related]
other = "Related pages"

[previousPage]
other = "Previous"

[nextPage]
other = "Next"

[wordCount]
one = "{{ .Count }} word"
other = "{{ .Count }} words"

[share]
other = "Share"

[editThisPage]
other = "Edit this page"

[backToTop]
other = "Back to top"

[copy]
other = "Copy"

[menu]
other = "Menu"

[menuOpen]
other = "open"

[menuClose]
other = "close"

[mainPage]
other = "Main page"

[linkToSection]
other = "Link to this section"

[subsections]
other = "Subtopics"

[furtherDown]
other = "Further down"

[pieceCount]
one = "{{ .Count }} piece"
other = "{{ .Count }} pieces"

[narrowing]
other = "Pieces"

[noMatch]
other = "Nothing carries all of those together. Drop one."

[clear]
other = "Clear the selection"

[searchLabel]
other = "Search"

[searchSubmit]
other = "Search"

[searchPlaceholder]
other = "A word from a title, the text or a tag"

# The rail's field is 11rem wide on a wide screen, so it holds a hint
# rather than the sentence the search page has room for.
[searchTerm]
other = "Search term"

[searchNothing]
other = "Nothing matches that."

[searchCount]
one = "{{ .Count }} piece"
other = "{{ .Count }} pieces"

[playOnYoutube]
other = "Play on YouTube"

[playOnVimeo]
other = "Play on Vimeo"

[playOnSoundcloud]
other = "Play on SoundCloud"

[embedElsewhere]
other = "Plays from {{ .Service }} once you press it"

[galleryClose]
other = "Close"

[galleryPrevious]
other = "Previous picture"

[galleryNext]
other = "Next picture"

[piecesTitle]
other = "Pieces"

[allTerms]
other = "All {{ .Taxonomy }}"

[galleryPosition]
other = "{{ .Index }} of {{ .Total }}"

# The two halves of the theme switch. Neither word is drawn: each is the
# accessible name of a button whose face is a sun or a moon.
[themeLight]
other = "Light theme"

[themeDark]
other = "Dark theme"

# The heading over the contents in their own column. The fold-out says
# "Contents"; this names the same list where it stands apart from the
# piece, in the register the other bands use.
[articleContents]
other = "Article contents"

# The languages a site publishes, named in the band across the top. One
# word, because the lettering says the rest: it is set in small capitals
# beside the codes, which are not.
[availableLanguages]
other = "Languages"

# What a language link announces. It opens with the code the link shows,
# because WCAG 2.5.3 asks the spoken name to contain the written one.
[languageName]
other = "{{ .Code }}, {{ .Label }}"

# The same, when this page has no version in that language. Pressing it
# goes to that language's home, which lists what it has.
[languageNoTranslation]
other = "{{ .Code }}, {{ .Label }}, which has no version of this page"
