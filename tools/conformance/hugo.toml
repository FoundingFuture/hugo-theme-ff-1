baseURL = "https://example.org/"
title = "Conformance"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableGitInfo = false

[pagination]
  pagerSize = 3

# Chroma's own colours are written into the markup as inline styles,
# and one of them fails AA contrast on every code block. Classes let the
# theme own its code colours, and its stylesheet fix them.
[markup.highlight]
  noClasses = false
  style = "xcode"

# A Markdown image alone in a paragraph is wrapped in <p> by Goldmark.
# figure-captions renders such an image as a <figure>, and a figure
# inside a paragraph closes it: the browser emits a stray </p> and the
# page stops being valid HTML.
#
# A theme cannot set this. Hugo merges params and other maps from a
# theme but not markup, so the site has to say it. Same wall that stops
# a theme adding an [outputs] format or a menus entry.
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[markup.goldmark.renderer]
  unsafe = false

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)']]

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"

[languages.en]
  label = "English"
  weight = 1
[languages.nl]
  label = "Nederlands"
  weight = 2

[menus]
  [[menus.main]]
    name = "Kitchen sink"
    pageRef = "/kitchen-sink"
    weight = 10
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 20
  [[menus.main]]
    name = "Nested"
    pageRef = "/kitchen-sink/sections"
    parent = "Kitchen sink"
    weight = 30

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]

[params.ff-1]
  # Fetching a poster needs the network at build time. The conformance
  # build stays offline and deterministic, so it is off here.
  fetchPosters = false

  # The band needs a line in it, or the band is at its floor and never
  # moves. The band gate measures the height of the band against the
  # offset that clears it, and a band that cannot grow is a measurement
  # that proves nothing: the fault it exists to catch is the band growing
  # past what the offset covers.
  #
  # Long on purpose. The line is sized to fill the band's width, so its
  # length is what decides where the size stops growing and the height
  # settles. A short line reaches its cap early and holds one height
  # across most of the sweep.
  #
  # It also has to read as a line somebody meant, because this build is
  # what the repository publishes to Pages. The first one here said what
  # it was for, and went up on the demo site saying it.
  tagline = 'A dense publishing theme for a site with a lot in it'
