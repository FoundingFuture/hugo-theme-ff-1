name = "rail-pages"
summary = "The pieces of the topic being read, listed in the menu under it."
# The rail is chrome, which the page-shape comparison excludes, so this
# adds nothing a manifest has to declare. It is a feature because it is
# the one thing in the menu whose cost grows with the site.
slot = "none"
weight = 10
default = true
level = "toggle"
kinds = ["page", "section", "home", "term", "taxonomy"]

[skeleton]
  # Nothing. Every row it adds sits inside the nav, and chrome is not
  # part of a page's shape.
  text = []
