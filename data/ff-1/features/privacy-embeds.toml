name = "privacy-embeds"
# Part of the theme rather than a component a site mounts. It overrides
# two shortcodes Hugo ships and adds one Hugo has none for, so a site
# gets it by installing the theme and nothing else.
slot = "body.end"
weight = 90
default = true
level = "toggle"
kinds = ["page", "section", "home", "term", "taxonomy"]
partial = "features/privacy-embeds.html"
css = "css/features/privacy-embeds.css"
i18n = ["playOnYoutube", "playOnVimeo", "playOnSoundcloud", "embedElsewhere"]

[skeleton]
  # A figure holding a link and a poster, in place of an iframe from
  # another host. The player replaces it only when a reader presses it.
  text = [
    "figure.embed", "figure.embed-youtube", "figure.embed-vimeo",
    "figure.embed-soundcloud", "span.embed-title", "figcaption.embed-caption",
  ]
  links = ["figure.embed"]
  images = ["figure.embed"]
  counts = ["figure"]
