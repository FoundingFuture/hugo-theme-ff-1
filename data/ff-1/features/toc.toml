name = "toc"
summary = "The headings of a piece, as a table of contents that folds."
slot = "page.before-body"
weight = 10
default = true
level = "toggle"
kinds = ["page"]
partial = "features/toc.html"
css = "css/features/toc.css"
i18n = ["contents"]

[skeleton]
  # It folds, so the summary's parts are marked as well. The chevron is
  # aria-hidden and the list sits inside the nav Fragments.ToHTML
  # writes, and neither presentation nor chrome is part of a page's
  # shape.
  text = ["details.toc", "span.nm", "span.n"]
