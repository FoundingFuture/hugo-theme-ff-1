{{- /* Needs params.ff-1.editBase, the repository path a page file sits under.
       Without it there is nowhere to send the reader. */ -}}
{{- with index site.Params "ff-1" "editBase" }}
<p class="edit-link">
  <a rel="external noopener" href="{{ . }}/{{ $.File.Path }}">{{ i18n "editThisPage" }}</a>
</p>
{{- end }}
